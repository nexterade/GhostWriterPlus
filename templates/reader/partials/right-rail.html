<aside class="right-rail reader-page-rail collapsed" id="page-drawer" aria-label="Daftar halaman">
  <div class="right-rail-header"><span class="right-rail-title">▤ Pages</span><button class="header-btn" id="right-rail-close" title="Tutup" aria-label="Tutup daftar halaman">✕</button></div>
  <div class="jump-row"><input id="page-jump" type="number" min="1" max="{{ TOTAL_PAGES }}" placeholder="Page" aria-label="Lompat ke halaman"><button id="page-jump-go">Go</button></div>
  <div id="page-list" class="page-list"></div>
</aside>
