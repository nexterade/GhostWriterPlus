<div class="notes-popover" id="notes-popover" role="dialog" aria-label="Notes dan highlight">
  <div class="settings-head"><strong>Bookmark &amp; Notes</strong><button class="close-btn" data-close="notes-popover" aria-label="Tutup">×</button></div>
  <div id="annotation-summary" class="annotation-summary"></div>
  <textarea id="note-input" rows="4" placeholder="Catatan untuk halaman ini..." aria-label="Catatan halaman"></textarea>
  <div class="annotation-actions"><button id="save-note">Simpan catatan</button><button id="clear-note">Hapus</button></div>
  <div class="annotation-help">Untuk highlight: pilih teks di halaman EPUB/TXT lalu tekan tombol Highlight.</div>
  <button id="highlight-selection" class="highlight-action">✦ Highlight teks terpilih</button>
</div>
<div class="selection-toolbar" id="selection-toolbar"><button id="selection-highlight">✦ Highlight</button><button id="selection-note">✎ Catat</button></div>
