<main class="reader-main" id="reader-main" aria-label="Book reader">
  <div class="reader-viewport" id="reader-viewport">
    <div class="book-stage" id="book-stage">
      <div class="page-slot page-slot-prev" id="page-prev-slot"></div>
      <div class="page-slot page-slot-current" id="page-current-slot"></div>
      <div class="page-slot page-slot-next" id="page-next-slot"></div>
      <div class="curl-sheet" id="curl-sheet" aria-hidden="true"><div class="curl-face curl-front" id="curl-front"></div><div class="curl-face curl-back" id="curl-back"></div></div>
    </div>
    <div class="webtoon-flow" id="webtoon-flow"></div>
    <div class="reader-empty-state" id="reader-empty-state" hidden><div class="empty-icon">📖</div><strong>Belum ada halaman</strong><span>File ini tidak menghasilkan konten yang dapat dibaca.</span></div>
  </div>
</main>
