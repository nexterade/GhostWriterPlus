<div class="settings-popover" id="settings-popover" role="dialog" aria-label="Reading settings">
  <div class="settings-head"><strong>Reading settings</strong><button class="close-btn" data-close="settings-popover" aria-label="Tutup">×</button></div>
  <label>Animasi halaman<select id="effect-select"><option value="curl">Page Flip</option><option value="slide">Slide</option><option value="fade">Fade</option></select></label>
  <label>Fit<select id="fit-select"><option value="auto">Auto</option><option value="width">Fit width</option><option value="height">Fit height</option></select></label>
  <label>Brightness <span id="brightness-value">100%</span><input id="brightness-range" type="range" min="30" max="100" step="1" value="100" aria-label="Brightness"></label>
  <label id="direction-setting">Arah halaman<select id="direction-select"><option value="ltr">Kiri → Kanan</option><option value="rtl">Kanan → Kiri</option></select></label>
  <label>Suara TTS<select id="tts-voice"><option value="id-ID">Indonesia</option><option value="en-US">English</option></select></label>
</div>
